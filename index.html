<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昨日旅馆</title>
<style>
  :root {
    --bg: #1a1410;
    --surface: #241e18;
    --surface2: #2d2620;
    --gold: #c8a96e;
    --gold-dim: #8a7048;
    --text: #d4c8b8;
    --text-dim: #8a8070;
    --accent: #b8733c;
    --danger: #8b3a3a;
    --input-bg: #1e1814;
    --border: #3a3028;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "STSong", serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Background texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(200,169,110,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(139,58,58,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  .header {
    position: relative;
    z-index: 1;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 1.3rem;
    font-weight: 400;
    color: var(--gold);
    letter-spacing: 0.15em;
    text-shadow: 0 0 30px rgba(200,169,110,0.2);
  }
  .header-actions {
    display: flex;
    gap: 10px;
  }

  /* Buttons */
  .btn {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 16px;
    font-size: 0.85rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn:hover {
    border-color: var(--gold-dim);
    color: var(--gold);
    background: #2a2420;
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #f0e0c8;
  }
  .btn.primary:hover {
    background: #c47a40;
    border-color: var(--gold);
  }
  .btn.danger {
    background: transparent;
    border-color: var(--danger);
    color: #d4a0a0;
  }
  .btn.danger:hover {
    background: rgba(139,58,58,0.2);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Main chat area */
  .chat-area {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar {
    width: 5px;
  }
  .chat-area::-webkit-scrollbar-track {
    background: transparent;
  }
  .chat-area::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  /* Messages */
  .msg {
    max-width: 85%;
    padding: 14px 18px;
    border-radius: 6px;
    line-height: 1.8;
    font-size: 0.95rem;
    animation: fadeIn 0.4s ease;
    white-space: pre-wrap;
    word-break: break-word;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.narrator {
    align-self: flex-start;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold-dim);
    color: var(--text);
  }
  .msg.player {
    align-self: flex-end;
    background: rgba(184,115,60,0.15);
    border: 1px solid rgba(184,115,60,0.3);
    color: #e0c8a8;
    text-align: right;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--text-dim);
    font-size: 0.8rem;
    font-style: italic;
    text-align: center;
    max-width: 100%;
    padding: 6px;
  }
  .msg .role-label {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    opacity: 0.7;
  }

  /* Loading dots */
  .msg.loading {
    align-self: flex-start;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold-dim);
    display: flex;
    gap: 6px;
    padding: 18px 22px;
  }
  .msg.loading .dot {
    width: 8px;
    height: 8px;
    background: var(--gold-dim);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .msg.loading .dot:nth-child(2) { animation-delay: 0.2s; }
  .msg.loading .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-10px); opacity: 1; }
  }

  /* Input bar */
  .input-bar {
    position: relative;
    z-index: 1;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .input-bar textarea {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    line-height: 1.6;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-bar textarea:focus {
    border-color: var(--gold-dim);
  }
  .input-bar textarea::placeholder {
    color: var(--text-dim);
    font-style: italic;
  }
  .send-btn {
    height: 44px;
    width: 44px;
    border-radius: 6px;
    border: 1px solid var(--gold-dim);
    background: rgba(200,169,110,0.1);
    color: var(--gold);
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .send-btn:hover {
    background: rgba(200,169,110,0.2);
    border-color: var(--gold);
  }
  .send-btn:disabled {
    opacity: 0.3;
    pointer-events: none;
  }

  /* Modal overlay */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    animation: fadeIn 0.3s ease;
  }
  .modal-overlay.hidden {
    display: none;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    width: 90%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-size: 1.2rem;
    color: var(--gold);
    font-weight: 400;
    letter-spacing: 0.1em;
    margin-bottom: 20px;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--gold-dim);
  }
  .modal .btn-row {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
  }
  .hint {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 4px;
    font-style: italic;
  }
  .error-msg {
    color: #d4a0a0;
    font-size: 0.82rem;
    margin-top: 4px;
  }

  /* Status indicator */
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.on  { background: #5a9e5a; box-shadow: 0 0 6px rgba(90,158,90,0.6); }
  .status-dot.off { background: #8b3a3a; box-shadow: 0 0 6px rgba(139,58,58,0.4); }
  .model-badge {
    font-size: 0.7rem;
    color: var(--text-dim);
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  @media (max-width: 600px) {
    .msg { max-width: 92%; font-size: 0.9rem; }
    .header h1 { font-size: 1.1rem; }
    .modal { padding: 20px; width: 95%; }
  }

  .status-bar { position:relative;z-index:1;padding:8px 20px;display:flex;align-items:center;gap:18px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--surface);font-size:0.78rem;color:var(--text-dim); }
  .status-bar .stat { display:flex;align-items:center;gap:5px; }
  .status-bar .stat .icon { font-size:1rem; }
  .status-bar .stat .val { color:var(--gold);font-weight:500; }
  .msg.death { align-self:center;background:rgba(139,58,58,0.2);border:1px solid var(--danger);color:#d4a0a0;text-align:center;max-width:90%;padding:16px;font-size:0.9rem; }
  .btn.small { padding:3px 8px;font-size:0.7rem; }
  .modal.wide { max-width:680px; }
  .encyclopedia { display:flex;gap:0;min-height:350px; }
  .encyclopedia .loc-list { width:140px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding-right:8px; }
  .encyclopedia .loc-item { padding:8px 10px;cursor:pointer;border-radius:4px;font-size:0.82rem;color:var(--text-dim);transition:all 0.15s;margin-bottom:2px; }
  .encyclopedia .loc-item:hover { background:var(--surface2);color:var(--text); }
  .encyclopedia .loc-item.active { background:var(--surface2);color:var(--gold);border-left:2px solid var(--gold-dim); }
  .encyclopedia .loc-item.locked { opacity:0.4;font-style:italic; }
  .encyclopedia .loc-detail { flex:1;padding:0 16px;overflow-y:auto;font-size:0.84rem;line-height:1.8; }
  .encyclopedia .loc-detail h4 { color:var(--gold);font-weight:400;margin-bottom:8px;font-size:1rem; }
  .encyclopedia .loc-detail .tag { display:inline-block;padding:1px 7px;border-radius:3px;font-size:0.7rem;margin-right:4px;margin-bottom:4px; }
  .encyclopedia .loc-detail .tag.npc { background:rgba(184,115,60,0.2);color:#e0c8a8;border:1px solid rgba(184,115,60,0.3); }
  .encyclopedia .loc-detail .tag.item { background:rgba(90,158,90,0.15);color:#a0d0a0;border:1px solid rgba(90,158,90,0.3); }
  .encyclopedia .loc-detail .tag.danger { background:rgba(139,58,58,0.2);color:#d4a0a0;border:1px solid rgba(139,58,58,0.3); }
  .inv-chip { font-size:0.7rem;padding:1px 8px;border-radius:10px;background:rgba(200,169,110,0.1);border:1px solid rgba(200,169,110,0.2);color:var(--gold-dim); }
  .inv-chip.empty { color:var(--text-dim);font-style:italic;border-style:dashed; }
  @media (max-width:600px) { .status-bar { gap:10px;font-size:0.72rem;padding:6px 14px; } .encyclopedia { flex-direction:column; } .encyclopedia .loc-list { width:100%;flex-direction:row;display:flex;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--border);padding-bottom:8px;gap:2px; } .encyclopedia .loc-detail { padding:12px 0 0 0; } }

</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>昨 日 旅 馆</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="model-badge" id="modelBadge">未连接</span>
    <span style="display:flex;align-items:center;font-size:0.78rem;color:var(--text-dim);">
      <span class="status-dot off" id="statusDot"></span>
      <span id="statusText">离线</span>
    </span>
    <button class="btn small" onclick="openEncyclopedia()" title="世界百科">📖</button>
    <button class="btn small" onclick="openSettings()" title="设置">⚙</button>
    <button class="btn small" onclick="saveGame()" title="存档">💾</button>
    <button class="btn small" onclick="loadGame()" title="读档">📂</button>
  </div>
</div>

<!-- Status Bar -->
<div class="status-bar" id="statusBar">
  <span class="stat"><span class="icon">📅</span>第 <span class="val" id="statDay">1</span> 天</span>
  <span class="stat"><span class="icon">📍</span><span class="val" id="statLocation">旅馆大堂</span></span>
  <span class="stat"><span class="icon">🎒</span><span id="statInventory"><span class="inv-chip empty">空空如也</span></span>
  </span>
</div>

<!-- Chat area -->
<div class="chat-area" id="chatArea">
  <div class="msg system">
    <div style="font-size:2rem;margin-bottom:8px;">🏨</div>
    欢迎来到昨日旅馆。<br>
    请先在右上角 <b>⚙ 设置</b> 中填入你的硅基流动 API Key，<br>
    然后开始你的冒险。
  </div>
</div>

<!-- Input bar -->
<div class="input-bar">
  <textarea id="userInput" placeholder="输入你的行动…" rows="1" disabled></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>▶</button>
</div>

<!-- Encyclopedia Modal -->
<div class="modal-overlay hidden" id="encyclopediaModal">
  <div class="modal wide">
    <h2>📖 世界百科</h2>
    <div class="encyclopedia">
      <div class="loc-list" id="locList"></div>
      <div class="loc-detail" id="locDetail"></div>
    </div>
    <div class="btn-row"><button class="btn" onclick="closeEncyclopedia()">关闭</button></div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal">
    <h2>⚙ 设置</h2>
    <div class="form-group">
      <label>硅基流动 API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxx">
      <div class="hint">在 <a href="https://cloud.siliconflow.cn" target="_blank" style="color:var(--gold-dim);">cloud.siliconflow.cn</a> 注册后获取</div>
    </div>
    <div class="form-group">
      <label>模型选择</label>
      <select id="modelSelect">
        <option value="deepseek-ai/DeepSeek-V3">DeepSeek V3（推荐 · 中文强）</option>
        <option value="Qwen/Qwen3-235B-A22B">Qwen3 235B（中文旗舰）</option>
        <option value="Qwen/Qwen2.5-72B-Instruct">Qwen2.5 72B</option>
        <option value="deepseek-ai/DeepSeek-R1">DeepSeek R1（深度推理）</option>
        <option value="Qwen/Qwen2.5-7B-Instruct">Qwen2.5 7B（快速廉价）</option>
      </select>
    </div>
    <div class="form-group">
      <label>自定义系统提示词（可选）</label>
      <textarea id="systemPromptInput" rows="4" placeholder="留空则使用默认旅馆世界观…"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn primary" onclick="saveSettings()">保存并连接</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
