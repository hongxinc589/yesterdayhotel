
⚙<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昨日旅馆</title>
<style>
  :root {
    --bg: #1a1410;
    --surface: #241e18;
    --surface2: #2d2620;
    --gold: #c8a96e;
    --gold-dim: #8a7048;
    --text: #d4c8b8;
    --text-dim: #8a8070;
    --accent: #b8733c;
    --danger: #8b3a3a;
    --input-bg: #1e1814;
    --border: #3a3028;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", "STSong", serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Background texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(200,169,110,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(139,58,58,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* Header */
  .header {
    position: relative;
    z-index: 1;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 1.3rem;
    font-weight: 400;
    color: var(--gold);
    letter-spacing: 0.15em;
    text-shadow: 0 0 30px rgba(200,169,110,0.2);
  }
  .header-actions {
    display: flex;
    gap: 10px;
  }

  /* Buttons */
  .btn {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 16px;
    font-size: 0.85rem;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn:hover {
    border-color: var(--gold-dim);
    color: var(--gold);
    background: #2a2420;
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #f0e0c8;
  }
  .btn.primary:hover {
    background: #c47a40;
    border-color: var(--gold);
  }
  .btn.danger {
    background: transparent;
    border-color: var(--danger);
    color: #d4a0a0;
  }
  .btn.danger:hover {
    background: rgba(139,58,58,0.2);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Main chat area */
  .chat-area {
    position: relative;
    z-index: 1;
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar {
    width: 5px;
  }
  .chat-area::-webkit-scrollbar-track {
    background: transparent;
  }
  .chat-area::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  /* Messages */
  .msg {
    max-width: 85%;
    padding: 14px 18px;
    border-radius: 6px;
    line-height: 1.8;
    font-size: 0.95rem;
    animation: fadeIn 0.4s ease;
    white-space: pre-wrap;
    word-break: break-word;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg.narrator {
    align-self: flex-start;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold-dim);
    color: var(--text);
  }
  .msg.player {
    align-self: flex-end;
    background: rgba(184,115,60,0.15);
    border: 1px solid rgba(184,115,60,0.3);
    color: #e0c8a8;
    text-align: right;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--text-dim);
    font-size: 0.8rem;
    font-style: italic;
    text-align: center;
    max-width: 100%;
    padding: 6px;
  }
  .msg .role-label {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    opacity: 0.7;
  }

  /* Loading dots */
  .msg.loading {
    align-self: flex-start;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold-dim);
    display: flex;
    gap: 6px;
    padding: 18px 22px;
  }
  .msg.loading .dot {
    width: 8px;
    height: 8px;
    background: var(--gold-dim);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .msg.loading .dot:nth-child(2) { animation-delay: 0.2s; }
  .msg.loading .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
    30% { transform: translateY(-10px); opacity: 1; }
  }

  /* Input bar */
  .input-bar {
    position: relative;
    z-index: 1;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  .input-bar textarea {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    line-height: 1.6;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-bar textarea:focus {
    border-color: var(--gold-dim);
  }
  .input-bar textarea::placeholder {
    color: var(--text-dim);
    font-style: italic;
  }
  .send-btn {
    height: 44px;
    width: 44px;
    border-radius: 6px;
    border: 1px solid var(--gold-dim);
    background: rgba(200,169,110,0.1);
    color: var(--gold);
    font-size: 1.2rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .send-btn:hover {
    background: rgba(200,169,110,0.2);
    border-color: var(--gold);
  }
  .send-btn:disabled {
    opacity: 0.3;
    pointer-events: none;
  }

  /* Modal overlay */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    animation: fadeIn 0.3s ease;
  }
  .modal-overlay.hidden {
    display: none;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    width: 90%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-size: 1.2rem;
    color: var(--gold);
    font-weight: 400;
    letter-spacing: 0.1em;
    margin-bottom: 20px;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--gold-dim);
  }
  .modal .btn-row {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
  }
  .hint {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 4px;
    font-style: italic;
  }
  .error-msg {
    color: #d4a0a0;
    font-size: 0.82rem;
    margin-top: 4px;
  }

  /* Status indicator */
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.on  { background: #5a9e5a; box-shadow: 0 0 6px rgba(90,158,90,0.6); }
  .status-dot.off { background: #8b3a3a; box-shadow: 0 0 6px rgba(139,58,58,0.4); }
  .model-badge {
    font-size: 0.7rem;
    color: var(--text-dim);
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  @media (max-width: 600px) {
    .msg { max-width: 92%; font-size: 0.9rem; }
    .header h1 { font-size: 1.1rem; }
    .modal { padding: 20px; width: 95%; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>昨 日 旅 馆</h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="model-badge" id="modelBadge">未连接</span>
    <span style="display:flex;align-items:center;font-size:0.78rem;color:var(--text-dim);">
      <span class="status-dot off" id="statusDot"></span>
      <span id="statusText">离线</span>
    </span>
    <button class="btn" onclick="openSettings()" title="设置">⚙</button>
  </div>
</div>

<!-- Chat area -->
<div class="chat-area" id="chatArea">
  <div class="msg system">
    <div style="font-size:2rem;margin-bottom:8px;">🏨</div>
    欢迎来到昨日旅馆。<br>
    请先在右上角 <b>⚙ 设置</b> 中填入你的硅基流动 API Key，<br>
    然后开始你的冒险。
  </div>
</div>

<!-- Input bar -->
<div class="input-bar">
  <textarea id="userInput" placeholder="输入你的行动…" rows="1" disabled></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>▶</button>
</div>

<!-- Settings Modal -->
<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal">
    <h2>⚙ 设置</h2>
    <div class="form-group">
      <label>硅基流动 API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxx">
      <div class="hint">在 <a href="https://cloud.siliconflow.cn" target="_blank" style="color:var(--gold-dim);">cloud.siliconflow.cn</a> 注册后获取</div>
    </div>
    <div class="form-group">
      <label>模型选择</label>
      <select id="modelSelect">
        <option value="deepseek-ai/DeepSeek-V3">DeepSeek V3（推荐 · 中文强）</option>
        <option value="Qwen/Qwen3-235B-A22B">Qwen3 235B（中文旗舰）</option>
        <option value="Qwen/Qwen2.5-72B-Instruct">Qwen2.5 72B</option>
        <option value="deepseek-ai/DeepSeek-R1">DeepSeek R1（深度推理）</option>
        <option value="Qwen/Qwen2.5-7B-Instruct">Qwen2.5 7B（快速廉价）</option>
      </select>
    </div>
    <div class="form-group">
      <label>自定义系统提示词（可选）</label>
      <textarea id="systemPromptInput" rows="4" placeholder="留空则使用默认旅馆世界观…"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="closeSettings()">取消</button>
      <button class="btn primary" onclick="saveSettings()">保存并连接</button>
    </div>
  </div>
</div>

<script>
// ============ STATE ============
let apiKey    = "";
let model     = "deepseek-ai/DeepSeek-V3";
let systemPrompt = "";
let messages  = []; // conversation history for AI
let isLoading = false;
let isConfigured = false;

// ============ DEFAULT SYSTEM PROMPT ============
const DEFAULT_SYSTEM_PROMPT = `你是一个文字冒险游戏的叙述者（Game Master），游戏名为《昨日旅馆》。

## 世界观
- 你是一座破败老旧旅馆的"意识"。这座旅馆建于民国时期，位于一座常年阴雨的山中小镇边缘。
- 旅馆共三层，木质结构，走廊深长，房间门牌模糊不清。墙壁渗出水渍，地板偶尔发出无人踩踏的吱呀声。
- 旅馆中住着一些奇怪的"常住客"——但他们似乎不是活着的人。
- 时间的流速在这里是不正常的。昨天可能是十年前，也可能是明天。

## 你的角色
- 你以旅馆的视角叙述，带有淡淡的民国文风，优美但阴郁，偶尔透出一丝诡谲的诗意。
- 你描述环境、气味、声音、光线、温度——让玩家感到身临其境。
- 你控制 NPC（旅馆中的住客），他们各有自己的秘密和故事。
- 当玩家做出行动时，你描述结果，推动剧情发展。
- 保持悬疑和神秘的氛围，但不要过早揭示所有真相。让玩家慢慢探索。

## 叙事规则
- 每次回复控制在 200-400 字，让玩家有继续行动的欲望。
- 始终使用第二人称"你"来称呼玩家。
- 每段回复结尾不要直接问"你要怎么做"，而是用环境描写或情境自然地让玩家想继续。
- 当玩家做出危险或愚蠢的举动时，给出相应的后果。
- 旅馆中隐藏着一个核心秘密——关于旅馆本身、关于那些住客、关于"昨日"的含义。让玩家在探索中逐渐接近真相。

## 开场
玩家在一个雨夜抵达旅馆。请用一段优美阴郁的文字，描述玩家推门而入的第一印象。`;

// ============ INIT ============
function init() {
  // Load saved settings from localStorage
  apiKey    = localStorage.getItem("yesterday_hotel_api_key") || "";
  model     = localStorage.getItem("yesterday_hotel_model") || "deepseek-ai/DeepSeek-V3";
  systemPrompt = localStorage.getItem("yesterday_hotel_system_prompt") || "";

  if (apiKey) {
    document.getElementById("apiKeyInput").value = apiKey;
    document.getElementById("modelSelect").value = model;
    document.getElementById("systemPromptInput").value = systemPrompt;
    connectAPI();
  }

  // Enter key to send
  document.getElementById("userInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  document.getElementById("userInput").addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 120) + "px";
  });
}

// ============ SETTINGS MODAL ============
function openSettings() {
  document.getElementById("settingsModal").classList.remove("hidden");
  document.getElementById("apiKeyInput").value = apiKey;
  document.getElementById("modelSelect").value = model;
  document.getElementById("systemPromptInput").value = systemPrompt;
}

function closeSettings() {
  document.getElementById("settingsModal").classList.add("hidden");
}

function saveSettings() {
  apiKey    = document.getElementById("apiKeyInput").value.trim();
  model     = document.getElementById("modelSelect").value;
  systemPrompt = document.getElementById("systemPromptInput").value.trim();

  if (!apiKey) {
    alert("请输入硅基流动 API Key");
    return;
  }

  localStorage.setItem("yesterday_hotel_api_key", apiKey);
  localStorage.setItem("yesterday_hotel_model", model);
  localStorage.setItem("yesterday_hotel_system_prompt", systemPrompt);

  closeSettings();
  connectAPI();
}

// ============ API CONNECTION ============
function connectAPI() {
  isConfigured = true;
  document.getElementById("statusDot").className = "status-dot on";
  document.getElementById("statusText").textContent = "就绪";
  document.getElementById("modelBadge").textContent = model.split("/").pop();
  document.getElementById("userInput").disabled = false;
  document.getElementById("sendBtn").disabled = false;
  document.getElementById("userInput").focus();
}

// ============ SEND MESSAGE ============
async function sendMessage() {
  if (isLoading || !isConfigured) return;

  const inputEl = document.getElementById("userInput");
  const userText = inputEl.value.trim();
  if (!userText) return;

  // Check API key
  if (!apiKey) {
    addSystemMsg("⚠ 请先在设置中填入硅基流动 API Key");
    openSettings();
    return;
  }

  // Add player message to UI
  addPlayerMsg(userText);
  inputEl.value = "";
  inputEl.style.height = "auto";

  // Add to conversation history
  messages.push({ role: "user", content: userText });

  // Show loading
  isLoading = true;
  document.getElementById("sendBtn").disabled = true;
  const loadingEl = addLoadingMsg();

  try {
    const response = await callAI(messages);
    removeLoading(loadingEl);

    // Add AI response to UI and history
    addNarratorMsg(response);
    messages.push({ role: "assistant", content: response });

    // Trim history if too long (keep system prompt + last 20 exchanges)
    trimHistory();

  } catch (err) {
    removeLoading(loadingEl);
    addSystemMsg("⚠ 连接失败：" + err.message);
    console.error(err);
  }

  isLoading = false;
  document.getElementById("sendBtn").disabled = false;
  document.getElementById("userInput").focus();
}

// ============ CALL SILICONFLOW API ============
async function callAI(conversation) {
  const effectiveSystem = systemPrompt || DEFAULT_SYSTEM_PROMPT;

  const body = {
    model: model,
    messages: [
      { role: "system", content: effectiveSystem },
      ...conversation
    ],
    temperature: 0.9,
    max_tokens: 800,
    top_p: 0.95,
    frequency_penalty: 0.3,
    presence_penalty: 0.3
  };

  const res = await fetch("https://api.siliconflow.cn/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + apiKey
    },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    const errMsg = errData.error?.message || errData.message || res.statusText;
    throw new Error(`${res.status}: ${errMsg}`);
  }

  const data = await res.json();
  const content = data.choices?.[0]?.message?.content || "";
  return content;
}

// ============ HISTORY MANAGEMENT ============
function trimHistory() {
  // Keep last 30 messages (15 exchanges)
  const maxMessages = 30;
  if (messages.length > maxMessages) {
    messages = messages.slice(messages.length - maxMessages);
  }
}

// ============ START GAME ============
async function startGame() {
  if (!isConfigured) {
    addSystemMsg("⚠ 请先在设置中填入硅基流动 API Key");
    openSettings();
    return;
  }
  if (!apiKey) {
    addSystemMsg("⚠ 请先在设置中填入硅基流动 API Key");
    openSettings();
    return;
  }

  // Clear UI and history
  document.getElementById("chatArea").innerHTML = "";
  messages = [];

  addSystemMsg("🏨 雨夜，你推开了昨日旅馆的门…");

  isLoading = true;
  document.getElementById("sendBtn").disabled = true;
  const loadingEl = addLoadingMsg();

  try {
    // Send the opening scene request
    const effectiveSystem = systemPrompt || DEFAULT_SYSTEM_PROMPT;
    const body = {
      model: model,
      messages: [
        { role: "system", content: effectiveSystem },
        { role: "user", content: "（游戏开始。请用一段优美阴郁的文字，描述玩家在雨夜抵达旅馆、推门而入的第一印象。从旅馆的视角来叙述。）" }
      ],
      temperature: 0.9,
      max_tokens: 800,
      top_p: 0.95,
      frequency_penalty: 0.3,
      presence_penalty: 0.3
    };

    const res = await fetch("https://api.siliconflow.cn/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + apiKey
      },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(`${res.status}: ${errData.error?.message || res.statusText}`);
    }

    const data = await res.json();
    const content = data.choices?.[0]?.message?.content || "";

    removeLoading(loadingEl);
    addNarratorMsg(content);
    messages.push({ role: "assistant", content: content });

  } catch (err) {
    removeLoading(loadingEl);
    addSystemMsg("⚠ 连接失败：" + err.message);
  }

  isLoading = false;
  document.getElementById("sendBtn").disabled = false;
  document.getElementById("userInput").focus();
}

// ============ UI HELPERS ============
function addNarratorMsg(text) {
  const div = document.createElement("div");
  div.className = "msg narrator";
  div.innerHTML = '<div class="role-label">🏨 旅馆</div>' + escapeHtml(text);
  document.getElementById("chatArea").appendChild(div);
  scrollToBottom();
  return div;
}

function addPlayerMsg(text) {
  const div = document.createElement("div");
  div.className = "msg player";
  div.innerHTML = '<div class="role-label">👤 你</div>' + escapeHtml(text);
  document.getElementById("chatArea").appendChild(div);
  scrollToBottom();
  return div;
}

function addSystemMsg(text) {
  const div = document.createElement("div");
  div.className = "msg system";
  div.textContent = text;
  document.getElementById("chatArea").appendChild(div);
  scrollToBottom();
  return div;
}

function addLoadingMsg() {
  const div = document.createElement("div");
  div.className = "msg loading";
  div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  document.getElementById("chatArea").appendChild(div);
  scrollToBottom();
  return div;
}

function removeLoading(el) {
  if (el && el.parentNode) {
    el.parentNode.removeChild(el);
  }
}

function scrollToBottom() {
  const area = document.getElementById("chatArea");
  requestAnimationFrame(() => {
    area.scrollTop = area.scrollHeight;
  });
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

// ============ STARTUP ============
init();

// Expose startGame globally
window.startGame = startGame;

// Show start button if configured
if (apiKey) {
  setTimeout(() => {
    const chatArea = document.getElementById("chatArea");
    chatArea.innerHTML = "";
    addSystemMsg("🏨 已连接到硅基流动 API");
    addSystemMsg('准备好了吗？<br><button class="btn primary" onclick="startGame()" style="margin-top:12px;">▶ 开始游戏</button>');
  }, 100);
}
</script>
